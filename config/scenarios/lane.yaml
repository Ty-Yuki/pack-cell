# 出荷レーンで3件の注文を連続して処理する(次の注文の解釈・欠品の確認・箱の選択・空箱の搬入・封函/出荷を、箱詰めと並行して進める)
# 品数は、選ばれる箱にちょうど収まる程度にしてある(注文1・2 は中、注文3 は小)
orders:
  - text: 牛乳と食パンを2つ、卵、水をお願いします。卵は最後に入れてください。   # 棚の最後の1本の牛乳を使う
  - text: 牛乳と豆腐とアイス、缶詰を2つと卵をお願いします。牛乳と豆腐とアイスはまとめて入れてください。
    # 牛乳は注文1で使い切る → 欠品 → LLM が代替を提案 → オペレータが承認
    approve: はい、低脂肪乳でお願いします。
    inject_fail: {tofu: 1}       # 豆腐の吸着を1回失敗させる
    events:
      - add: やっぱり水も1本追加して
        choose: repack           # LLM の推奨が別の箱でも、オペレータは箱を1つにまとめる詰め直しを選ぶ
        reply: 箱は1つにまとめたいので、詰め直しでお願いします。
  - text: 缶詰を2つとポテトチップス、豆腐をお願いします。
